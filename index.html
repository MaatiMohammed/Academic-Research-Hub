<html lang="en" data-theme="dark">

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Academic Research Hub</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg-body: #f8fafc;
        --bg-card: #ffffff;
        --text-primary: #0f172a;
        --text-secondary: #64748b;
        --border-color: #e2e8f0;
        --primary-accent: #8b5cf6;
        --secondary-accent: #06b6d4;
        --card-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1),
          0 2px 4px -2px rgb(0 0 0 / 0.1);
        --card-hover-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1),
          0 8px 10px -6px rgb(0 0 0 / 0.1);
        --transition-speed: 0.3s;
      }

      [data-theme="dark"] {
        --bg-body: #0f172a;
        --bg-card: #1e293b;
        --text-primary: #f1f5f9;
        --text-secondary: #94a3b8;
        --border-color: #334155;
        --primary-accent: #a78bfa;
        --secondary-accent: #22d3ee;
        --card-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.5);
        --card-hover-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.5);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: "Inter", sans-serif;
        background-color: var(--bg-body);
        color: var(--text-primary);
        transition: background-color var(--transition-speed),
          color var(--transition-speed);
        line-height: 1.5;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      header {
        padding: 1.5rem 2rem;
        max-width: 1400px;
        margin: 0 auto;
        width: 100%;
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 1rem;
        border-bottom: 1px solid var(--border-color);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        font-weight: 700;
        font-size: 1.5rem;
        color: var(--text-primary);
      }

      .brand-icon {
        width: 32px;
        height: 32px;
        background: linear-gradient(
          135deg,
          var(--primary-accent),
          var(--secondary-accent)
        );
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-size: 1.2rem;
      }

      .controls {
        display: flex;
        align-items: center;
        gap: 1rem;
        flex-grow: 1;
        justify-content: flex-end;
      }

      .search-wrapper {
        position: relative;
        width: 100%;
        max-width: 400px;
      }

      .search-wrapper input {
        width: 100%;
        padding: 0.75rem 1rem 0.75rem 2.5rem;
        border-radius: 12px;
        border: 1px solid var(--border-color);
        background-color: var(--bg-card);
        color: var(--text-primary);
        font-family: inherit;
        font-size: 0.95rem;
        outline: none;
        transition: all 0.2s ease;
      }

      .search-wrapper input:focus {
        border-color: var(--primary-accent);
        box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.1);
      }

      .search-icon {
        position: absolute;
        left: 1rem;
        top: 50%;
        transform: translateY(-50%);
        width: 16px;
        height: 16px;
        fill: var(--text-secondary);
        pointer-events: none;
      }

      .filter-group {
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
      }

      .filter-btn {
        padding: 0.5rem 1rem;
        border: 1px solid var(--border-color);
        background: var(--bg-card);
        color: var(--text-secondary);
        border-radius: 8px;
        cursor: pointer;
        font-size: 0.85rem;
        font-weight: 500;
        transition: all 0.2s ease;
      }

      .filter-btn:hover {
        border-color: var(--primary-accent);
        color: var(--primary-accent);
      }

      .filter-btn.active {
        background: var(--primary-accent);
        color: white;
        border-color: var(--primary-accent);
      }

      .theme-toggle {
        background: none;
        border: 1px solid var(--border-color);
        border-radius: 12px;
        padding: 0.75rem;
        cursor: pointer;
        background-color: var(--bg-card);
        color: var(--text-primary);
        transition: all 0.2s ease;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .theme-toggle:hover {
        border-color: var(--text-secondary);
      }

      main {
        flex: 1;
        max-width: 1400px;
        width: 100%;
        margin: 0 auto;
        padding: 2rem;
      }

      .section-header {
        margin-bottom: 1.5rem;
        padding-bottom: 0.75rem;
        border-bottom: 2px solid var(--border-color);
      }

      .section-title {
        font-size: 1.25rem;
        font-weight: 600;
        color: var(--text-primary);
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      .section-count {
        font-size: 0.85rem;
        color: var(--text-secondary);
        font-weight: 500;
        padding: 0.25rem 0.75rem;
        background: var(--bg-body);
        border-radius: 12px;
      }

      .grid-container {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 1.5rem;
        width: 100%;
        margin-bottom: 2rem;
      }

      .card {
        background-color: var(--bg-card);
        border: 1px solid var(--border-color);
        border-radius: 16px;
        padding: 1.5rem;
        cursor: pointer;
        transition: all var(--transition-speed) cubic-bezier(0.4, 0, 0.2, 1);
        position: relative;
        display: flex;
        flex-direction: column;
        gap: 1rem;
        text-decoration: none;
        color: inherit;
        outline: none;
      }

      .card:hover,
      .card:focus {
        transform: translateY(-4px);
        box-shadow: var(--card-hover-shadow);
        border-color: var(--primary-accent);
      }

      .card-header {
        display: flex;
        align-items: center;
        gap: 1rem;
      }

      .card-logo {
        width: 56px;
        height: 56px;
        border-radius: 12px;
        object-fit: contain;
        background: var(--bg-body);
        padding: 0.5rem;
      }

      .card-info {
        display: flex;
        flex-direction: column;
        flex: 1;
      }

      .card-title {
        font-weight: 600;
        font-size: 1.15rem;
        color: var(--text-primary);
        margin-bottom: 0.25rem;
      }

      .card-subtitle {
        font-size: 0.85rem;
        color: var(--text-secondary);
        font-weight: 500;
      }

      .card-description {
        font-size: 0.9rem;
        color: var(--text-secondary);
        line-height: 1.6;
      }

      .card-footer {
        margin-top: auto;
        padding-top: 1rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-top: 1px solid var(--border-color);
      }

      .card-tags {
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
      }

      .tag {
        font-size: 0.7rem;
        padding: 0.25rem 0.5rem;
        border-radius: 6px;
        background-color: rgba(139, 92, 246, 0.1);
        color: var(--primary-accent);
        font-weight: 600;
      }

      .external-icon {
        width: 18px;
        height: 18px;
        fill: var(--text-secondary);
        opacity: 0;
        transform: translateX(-5px);
        transition: all 0.2s ease;
      }

      .card:hover .external-icon {
        opacity: 1;
        transform: translateX(0);
      }

      .no-results {
        grid-column: 1 / -1;
        text-align: center;
        padding: 3rem;
        color: var(--text-secondary);
      }

      @media (max-width: 768px) {
        header {
          flex-direction: column;
          align-items: flex-start;
        }
        .controls {
          width: 100%;
          flex-direction: column;
        }
        .search-wrapper {
          max-width: 100%;
        }
        .filter-group {
          width: 100%;
        }
        .grid-container {
          grid-template-columns: 1fr;
        }
      }
      footer {
          margin-top: auto;
          padding: 2rem;
          border-top: 1px solid var(--border-color);
          background-color: var(--bg-card);
        }

        .footer-content {
          max-width: 1400px;
          margin: 0 auto;
          display: flex;
          justify-content: space-between;
          align-items: center;
          flex-wrap: wrap;
          gap: 1rem;
        }

        .footer-content p {
          color: var(--text-secondary);
          font-size: 0.9rem;
          margin: 0;
        }

        .footer-links {
          display: flex;
          gap: 1.5rem;
          align-items: center;
        }

        .github-link {
          display: flex;
          align-items: center;
          gap: 0.5rem;
          color: var(--text-primary);
          text-decoration: none;
          font-weight: 500;
          font-size: 0.9rem;
          padding: 0.5rem 1rem;
          border-radius: 8px;
          border: 1px solid var(--border-color);
          transition: all 0.2s ease;
        }

        .github-link:hover {
          background-color: var(--bg-body);
          border-color: var(--primary-accent);
          color: var(--primary-accent);
          transform: translateY(-2px);
        }

        .github-link svg {
          transition: transform 0.2s ease;
        }

        .github-link:hover svg {
          transform: rotate(360deg);
        }

        @media (max-width: 768px) {
          .footer-content {
            flex-direction: column;
            text-align: center;
          }
        }
    </style>
  </head>

      const grid = document.getElementById("cardGrid");
      const searchInput = document.getElementById("searchInput");
      const themeToggle = document.getElementById("themeToggle");
      const filterBtns = document.querySelectorAll(".filter-btn");

      let currentFilter = "all";

      function renderCards(searchText = "") {
        grid.innerHTML = "";

        const filtered = researchTools.filter((tool) => {
          const matchesSearch =
            tool.name.toLowerCase().includes(searchText.toLowerCase()) ||
            tool.subtitle.toLowerCase().includes(searchText.toLowerCase()) ||
            tool.description.toLowerCase().includes(searchText.toLowerCase());
          const matchesFilter =
            currentFilter === "all" || tool.category === currentFilter;
          return matchesSearch && matchesFilter;
        });

        if (filtered.length === 0) {
          grid.innerHTML =
            '<div class="no-results">No research tools found matching your criteria.</div>';
          return;
        }

        filtered.forEach((tool) => {
          const card = document.createElement("a");
          card.className = "card";
          card.href = tool.url;
          card.target = "_blank";
          card.rel = "noopener noreferrer";
          card.tabIndex = 0;

          card.innerHTML = `
                    <div class="card-header">
                        <img src="${tool.logo}" alt="${
            tool.name
          } Logo" class="card-logo" onerror="this.style.display='none'">
                        <div class="card-info">
                            <div class="card-title">${tool.name}</div>
                            <div class="card-subtitle">${tool.subtitle}</div>
                        </div>
                    </div>
                    <div class="card-description">${tool.description}</div>
                    <div class="card-footer">
                        <div class="card-tags">
                            ${tool.tags
                              .map((tag) => `<span class="tag">${tag}</span>`)
                              .join("")}
                        </div>
                        <svg class="external-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
                    </div>
                `;

          grid.appendChild(card);
        });
      }

      searchInput.addEventListener("input", (e) => {
        renderCards(e.target.value);
      });

      filterBtns.forEach((btn) => {
        btn.addEventListener("click", () => {
          filterBtns.forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
          currentFilter = btn.dataset.filter;
          renderCards(searchInput.value);
        });
      });

      themeToggle.addEventListener("click", () => {
        const html = document.documentElement;
        const currentTheme = html.getAttribute("data-theme");
        const newTheme = currentTheme === "light" ? "dark" : "light";
        html.setAttribute("data-theme", newTheme);
      });

      document.addEventListener("keydown", (e) => {
        if (e.key === "/" && document.activeElement !== searchInput) {
          e.preventDefault();
          searchInput.focus();
        }
      });

      renderCards();
    </script>
